# Daily update of the EU agri tracker: collects data, posts notifications on
# followed files, saves the data in data/ and publishes the website (GitHub Pages).
name: Update tracker

on:
  schedule:
    # GitHub runs schedules on a best-effort basis (they can start late or be skipped),
    # so there are several slots: a missed one is covered by the next.
    - cron: "41 4 * * 1-5"    # 05:41 Madrid (winter time), Monday to Friday
    - cron: "11 9 * * 1-5"    # 10:11
    - cron: "41 13 * * 1-5"   # 14:41
    - cron: "11 18 * * 1-5"   # 19:11
    - cron: "41 9 * * 6,0"    # Saturday and Sunday morning
  workflow_dispatch:
  push:                                  # editing config.yml or the code runs an update
    branches: [main]
    paths: ["config.yml", "tracker/**", "site/**", ".github/workflows/update.yml"]
  issues:
    types: [opened, reopened]            # a new "follow" issue gets its first update quickly

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'follow')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main                        # latest data, even if this run waited in the queue

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect, compare, notify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tracker.run

      - name: Save the data
        run: |
          git config user.name "eu-agri-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -q -m "Data update $(date -u +'%Y-%m-%d %H:%M') UTC"
            for attempt in 1 2 3 4; do
              # On a conflict keep this run's data (it is the newest)
              if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then
                echo "Data saved"; break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 10))
            done
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
