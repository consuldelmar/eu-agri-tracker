name: Probe (temporary)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/probe/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pip install requests && python .github/probe/probe.py
      - run: |
          cd out && gzip -9 *.json && git init -q -b probe-data && git add . \
            && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm probe \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-data
