# Source test for the EU agri tracker.
# Contacts every planned data source once from GitHub's servers and reports
# which ones work. Run it by hand from the Actions tab ("Run workflow").
# It also repeats every morning so a few days of results can be compared;
# disable it afterwards (Actions > this workflow > "..." > Disable workflow).

name: Source test

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"   # 05:23 UTC = 06:23 in Barcelona (winter time)

permissions:
  contents: read

jobs:
  test-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the one library needed
        run: pip install "requests>=2.31,<3"

      - name: Test every source
        env:
          # Optional. Set these under Settings > Secrets and variables > Actions
          # to also receive the report by e-mail. Without them the test still runs.
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python probe.py

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-test-report
          path: |
            report.md
            report.json
          if-no-files-found: ignore
          retention-days: 30
