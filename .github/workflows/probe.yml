name: Probe (temporary)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/probe/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pip install requests && python .github/probe/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out/
